name: Weekly deal check

on:
  schedule:
    - cron: '0 8 * * 1' # every Monday, 08:00 UTC
  workflow_dispatch: {} # allows manual trigger from the Actions tab

jobs:
  fetch-deals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check watchlisted prices via Keepa
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: node scripts/fetch-deals.js

      - name: Commit updated deals
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Weekly automatic price check (Keepa)'
          file_pattern: assets/deals-auto.json
